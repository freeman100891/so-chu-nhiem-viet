  <path d="M36 68 Q50 78 64 68 L68 76 Q50 86 32 76 Z" fill="#f8fafc"/>
  <circle cx="44" cy="74" r="1" fill="#0f172a"/>
  <circle cx="50" cy="77" r="1" fill="#0f172a"/>
  <circle cx="56" cy="74" r="1" fill="#0f172a"/>
  <!-- Gold Royal Scepter in Foreground -->
  <circle cx="78" cy="76" r="4.5" fill="url(#crownGold)"/>
