  <circle cx="36" cy="32" r="1.5" fill="#38bdf8"/>
  <circle cx="64" cy="32" r="1.5" fill="#38bdf8"/>
  <!-- Face -->
  <circle cx="50" cy="51" r="18" fill="url(#skinGradR5)"/>
  <!-- Eyes & Majestic Gracious Smile -->
  <circle cx="44" cy="50" r="2.5" fill="#1e1b4b"/>
  <circle cx="56" cy="50" r="2.5" fill="#1e1b4b"/>
