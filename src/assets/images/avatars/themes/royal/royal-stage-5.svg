  <circle cx="57" cy="49" r="0.8" fill="#ffffff"/>
  <path d="M45 57 Q50 62 55 57" stroke="#b91c1c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="40" cy="55" r="2.5" fill="#f43f5e" opacity="0.4"/>
  <circle cx="60" cy="55" r="2.5" fill="#f43f5e" opacity="0.4"/>
